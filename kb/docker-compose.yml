name: video2kb-kb

services:
  kb-api:
    build:
      context: ..                # 项目根目录（以便 COPY shared/）
      dockerfile: kb/Dockerfile
    container_name: video2kb-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - API_KEY=${API_KEY:-dev-key}
      - ENABLE_GRAPH=false
      - ENABLE_VECTOR=true
      - CHROMA_DIR=/app/data/chroma
      - CHROMA_COLLECTION=${CHROMA_COLLECTION:-video2kb}
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-zhipu}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-embedding-3}
      - ENABLE_LLAMAINDEX=false
    volumes:
      - chroma_data:/app/data/chroma
      - ../shared:/app/shared:ro
    restart: unless-stopped

volumes:
  chroma_data:
