name: video2kb-transcoder

services:
  transcoder:
    build:
      context: ..
      dockerfile: transcoder/Dockerfile
    container_name: video2kb-transcoder
    ports:
      - "${PORT:-8002}:8002"
    environment:
      - STORAGE_URL=${STORAGE_URL:-http://storage:8001}
      - STORAGE_API_KEY=${STORAGE_API_KEY:-}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - WHISPER_LANGUAGE=${WHISPER_LANGUAGE:-zh}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-auto}
      - TASK_QUEUE=${TASK_QUEUE:-memory}
      - MAX_CONCURRENT_TASKS=${MAX_CONCURRENT_TASKS:-1}
      - API_KEY=${API_KEY:-dev-key}
      - HF_ENDPOINT=https://hf-mirror.com
    restart: unless-stopped
